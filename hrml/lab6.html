<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/lab6.css">
    <title>Calculator</title>
</head>
<body class="body">
    <div class="calculator">
        <input type="text" class="display" id="display" value="0" randomly>

        <div class="button">
            <button class="function big" type="button" onclick="clearDisplay()">C</button>
            <button class="function" type="button" onclick="appendValue('+/-')">±</button>
            <button class="operator" type="button" onclick="appendValue('/')">/</button>

            <button class="number" type="button" onclick="appendValue('7')">7</button>
            <button class="number" type="button" onclick="appendValue('8')">8</button>
            <button class="number" type="button" onclick="appendValue('9')">9</button>
            <button class="operator" type="button" onclick="appendValue('*')">*</button>

            <button class="number" type="button" onclick="appendValue('4')">4</button>
            <button class="number" type="button" onclick="appendValue('5')">5</button>
            <button class="number" type="button" onclick="appendValue('6')">6</button>
            <button class="operator" type="button" onclick="appendValue('-')">-</button>

            <button class="number" type="button" onclick="appendValue('1')">1</button>
            <button class="number" type="button" onclick="appendValue('2')">2</button>
            <button class="number" type="button" onclick="appendValue('3')">3</button>
            <button class="operator" type="button" onclick="appendValue('+')">+</button>

            <button class="number zero" type="button" onclick="appendValue('0')">0</button>
            <button class="number" type="button" onclick="appendValue('.')">.</button>
            <button class="buttonbig" type="button" onclick="calculate()">=</button>
        </div>
    </div>

    <script src="../js/main.js"></script>
</body>
</html>
